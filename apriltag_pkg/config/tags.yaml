apriltag:
  ros__parameters:
    image_transport: raw    # или 'compressed', если используете сжатие
    family: 36h11          # Семейство тегов
    size: 0.2              # Размер тега по умолчанию в метрах
    max_hamming: 0         # Макс. расстояние Хэмминга
    detector:
      threads: 4           # Число потоков
      decimate: 1.0        # Декимация
      blur: 0.0            # Размытие
      refine: 1            # Уточнение
      sharpening: 0.25     # Затачивание
      debug: 1             # Отладка (0 - выкл)
    tag:
      ids: [0, 1, 2]       # ID тегов (добавьте свои)
      sizes: [0.2, 0.2, 0.2]  # Размеры для каждого ID (опционально)